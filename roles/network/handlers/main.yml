---
- name: Restart systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd.service
    enabled: true
    state: restarted

- name: Restart managed firewall
  systemd:
    name: iptables-rules.service
    daemon_reload: true
    state: restarted

- name: Restart threat-feed updater
  ansible.builtin.systemd:
    name: threatfeed-updater.service
    daemon_reload: true
    state: restarted

- name: Reload systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: reloaded

- name: Reload sysctl
  command: /usr/sbin/sysctl --system
